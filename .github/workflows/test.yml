name: CI Suite

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Foundry Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Unit Tests
        run: forge test -vvv
